# canon go-golangci-lint-00001
version: "2"

linters:
  # canon go-golangci-lint-00002
  default: standard
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - dogsled
    - durationcheck
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - godot
    - godox
    - gomoddirectives
    - gosec
    - interfacebloat
    - ireturn
    - loggercheck
    - makezero
    - mirror
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - zerologlint
  # canon go-golangci-lint-00014; the deviation is declared in canon.toml
  exclusions:
    generated: lax
    rules:
      # G304 and G703 name a path an attacker controls. Every finding here is a
      # fixture this package's own test opened under t.TempDir() or testdata/,
      # where the "tainted" value is the test's own argument, so the rule guards
      # nothing. Production code keeps both rules.
      - path: _test\.go$
        linters:
          - gosec
        text: ^G(304|703)
  settings:
    # canon go-golangci-lint-00008
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    # canon go-golangci-lint-00010
    exhaustive:
      check:
        - mapliteral
        - switch
    # canon go-golangci-lint-00013
    ireturn:
      allow:
        - anon
        - empty
        - error
        - generic
        - stdlib
    # canon go-golangci-lint-00011
    gomoddirectives:
      replace-local: true
    # canon go-golangci-lint-00009
    gocritic:
      disabled-tags:
        - experimental
        - opinionated
        - performance
        - style
    # canon go-golangci-lint-00004
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    # canon go-golangci-lint-00005
    staticcheck:
      checks: ["all"]
    # canon go-golangci-lint-00006
    nolintlint:
      require-explanation: true
      require-specific: true

# canon go-golangci-lint-00003
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# canon go-golangci-lint-00007
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    # canon go-golangci-lint-00012
    gofumpt:
      extra:
        group-params: true
